<app-nav>
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-8 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
            <div>
                <p class="m-0 text-sm font-semibold uppercase tracking-widest text-brand-600">{{ today | date: 'EEEE, MMMM d' }}</p>
                <h1 class="m-0 mt-1 font-display text-4xl font-bold uppercase text-ink-900">Dashboard</h1>
            </div>
            <p class="m-0 text-sm text-ink-500">Your gym at a glance for {{ today | date: 'yyyy' }}.</p>
        </div>

        <div class="grid grid-cols-1 gap-6 xl:grid-cols-2">
            <section *ngFor="let card of cards" class="rounded-2xl border border-ink-100 bg-white p-6 shadow-sm">
                <header class="mb-4 flex items-center gap-3">
                    <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-ink-900 text-brand-400">
                        <span class="material-icons">{{ card.icon }}</span>
                    </span>
                    <div>
                        <h2 class="m-0 text-base font-semibold text-ink-900">{{ card.title }}</h2>
                        <p class="m-0 text-xs text-ink-500">{{ card.subtitle }}</p>
                    </div>
                </header>

                <ng-container [ngSwitch]="card.chart">
                    <app-members-chart *ngSwitchCase="'members'"></app-members-chart>
                    <app-products-chart *ngSwitchCase="'products'"></app-products-chart>
                    <app-doughnut-chart *ngSwitchCase="'genders'"></app-doughnut-chart>
                    <app-income-chart *ngSwitchCase="'income'"></app-income-chart>
                </ng-container>
            </section>
        </div>
    </div>
</app-nav>
