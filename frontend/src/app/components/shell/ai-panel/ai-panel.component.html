<ng-container *ngIf="open">
    <!-- Backdrop when the panel overlays the page (below xl) -->
    <div *ngIf="!docked" class="fixed inset-0 z-40 bg-ink bg-opacity-20" (click)="close()" aria-hidden="true"></div>

    <aside
        id="ai-panel"
        aria-labelledby="ai-panel-title"
        [attr.role]="docked ? 'complementary' : 'dialog'"
        [attr.aria-modal]="docked ? null : 'true'"
        [cdkTrapFocus]="!docked"
        (keydown)="onKeydown($event)"
        class="studio z-50 flex flex-col overflow-hidden bg-surface shadow-card"
        [ngClass]="docked
            ? 'sticky top-4 h-[calc(100vh-2rem)] w-[400px] flex-shrink-0 rounded-panel'
            : (phone ? 'fixed inset-0' : 'fixed bottom-4 end-4 top-4 w-[400px] max-w-[calc(100vw-2rem)] rounded-panel shadow-overlay')"
    >
        <!-- Header -->
        <div class="flex items-center gap-2.5 border-b border-solid border-line-soft px-[18px] py-4">
            <span class="flex h-[34px] w-[34px] items-center justify-center rounded-[11px] bg-accent-soft text-accent">
                <app-icon name="sparkle" [size]="18"></app-icon>
            </span>
            <h2 id="ai-panel-title" class="text-base font-extrabold text-ink">{{ 'shell.ai.title' | translate }}</h2>
            <span class="rounded-full bg-surface-muted px-[7px] py-0.5 text-[11px] font-bold text-neutral">{{ 'shell.ai.beta' | translate }}</span>
            <span class="flex-grow"></span>
            <button type="button" appIconButton icon="pen" [iconSize]="16" [label]="'shell.ai.newChat' | translate" disabled></button>
            <button #closeButton type="button" appIconButton icon="x" [label]="'shell.ai.close' | translate" (click)="close()"></button>
        </div>

        <!-- Empty state -->
        <div class="flex flex-1 flex-col items-center justify-center gap-4 overflow-y-auto px-8 py-6 text-center">
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-accent-soft text-accent">
                <app-icon name="sparkle" [size]="26"></app-icon>
            </span>
            <div class="flex flex-col gap-1.5">
                <p class="text-lg font-extrabold tracking-card text-ink">{{ 'shell.ai.comingSoonTitle' | translate }}</p>
                <p class="text-sm leading-relaxed text-ink-3">{{ 'shell.ai.comingSoonBody' | translate }}</p>
            </div>
            <div class="flex flex-col items-center gap-2">
                <span class="text-[11px] font-bold uppercase tracking-label text-ink-4">{{ 'shell.ai.youCanAsk' | translate }}</span>
                <ul class="flex flex-wrap justify-center gap-1.5" [attr.aria-label]="'shell.ai.examplesLabel' | translate">
                    <li *ngFor="let example of examples">
                        <button type="button" disabled class="h-8 rounded-full border border-solid border-line bg-surface-subtle px-3 text-xs font-semibold text-ink-2 opacity-70">{{ example | translate }}</button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Composer (disabled) -->
        <div class="flex flex-col gap-2.5 border-t border-solid border-line-soft px-4 pb-4 pt-3.5">
            <label for="ai-composer" class="sr-only">{{ 'shell.ai.composerLabel' | translate }}</label>
            <div class="flex items-center gap-2 rounded-[18px] border border-solid border-line-strong bg-surface-subtle py-1.5 pe-1.5 ps-3.5">
                <input id="ai-composer" type="text" disabled [value]="draft" [placeholder]="'shell.ai.composerPlaceholder' | translate"
                    class="min-w-0 flex-grow border-0 bg-transparent p-0 text-sm text-ink placeholder-ink-3 outline-none" />
                <button type="button" appIconButton icon="paperclip" [iconSize]="17" [label]="'shell.ai.attach' | translate" disabled></button>
                <button type="button" disabled [attr.aria-label]="'shell.ai.send' | translate" class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-tile border-0 bg-accent text-white opacity-40">
                    <app-icon name="arrow-up" [size]="17"></app-icon>
                </button>
            </div>
            <p class="text-center text-xs text-ink-3">{{ 'shell.ai.notConnected' | translate }}</p>
        </div>
    </aside>
</ng-container>
