<div class="min-h-screen bg-canvas">
    <a href="#main-content" class="studio skip-link">Skip to content</a>

    <!-- Phone drawer backdrop -->
    <div *ngIf="isPhone && drawerOpen" class="fixed inset-0 z-40 bg-ink bg-opacity-40" (click)="closeDrawer()" aria-hidden="true"></div>

    <div class="flex min-h-screen md:gap-4 md:p-4">
        <!-- ============ Sidebar ============ -->
        <aside
            class="studio z-50 flex flex-shrink-0 flex-col gap-[18px] bg-surface shadow-card"
            [ngClass]="isPhone
                ? 'fixed inset-y-0 left-0 w-72 max-w-[85vw] transform overflow-y-auto rounded-r-panel px-3.5 py-[18px] transition-transform duration-200 ease-out ' + (drawerOpen ? 'translate-x-0' : '-translate-x-full invisible')
                : 'sticky top-4 h-[calc(100vh-2rem)] rounded-panel py-[18px] ' + (collapsed ? 'w-[72px] items-center px-3' : 'w-64 overflow-y-auto px-3.5')"
            [attr.role]="isPhone ? 'dialog' : null"
            [attr.aria-modal]="isPhone ? 'true' : null"
            [attr.aria-label]="isPhone ? 'Navigation' : null"
            [cdkTrapFocus]="isPhone && drawerOpen"
        >
            <!-- Wordmark + collapse -->
            <div class="flex items-center" [ngClass]="collapsed ? 'flex-col gap-3' : 'justify-between px-1.5'">
                <a routerLink="/home" class="flex items-baseline gap-[3px] text-[23px] font-extrabold tracking-logo text-ink" aria-label="easyfit, go to dashboard">
                    <ng-container *ngIf="!collapsed">easyfit</ng-container><ng-container *ngIf="collapsed">ef</ng-container><span class="inline-block h-2 w-2 rounded-full bg-accent" aria-hidden="true"></span>
                </a>
                <button *ngIf="canToggleCollapse" appIconButton icon="panel-left" [label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'" [attr.aria-expanded]="!collapsed" (click)="shell.toggleSidebar()"></button>
                <button *ngIf="isPhone" #drawerCloseButton appIconButton icon="x" label="Close navigation" (click)="closeDrawer()"></button>
            </div>

            <!-- Gym card (static label for now; becomes a switcher if multi-gym is added) -->
            <div class="flex items-center gap-2.5 rounded-2xl border border-solid border-line bg-surface-subtle" [ngClass]="collapsed ? 'justify-center border-0 bg-transparent p-0' : 'p-2.5'" [attr.title]="collapsed ? gymName : null">
                <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-[10px] bg-ink text-[13px] font-extrabold text-white" aria-hidden="true">{{ gymInitials }}</span>
                <span *ngIf="!collapsed" class="flex min-w-0 flex-col">
                    <span class="truncate text-sm font-bold text-ink" dir="auto">{{ gymName }}</span>
                    <span class="truncate text-xs text-ink-3">{{ gymSubtitle }}</span>
                </span>
                <span *ngIf="collapsed" class="sr-only">{{ gymName }}</span>
            </div>

            <!-- Ask EasyFit AI -->
            <button type="button" (click)="shell.toggleAiPanel()" [attr.aria-expanded]="aiPanelOpen" aria-controls="ai-panel" aria-keyshortcuts="Control+J Meta+J"
                class="rail-link relative flex h-11 flex-shrink-0 items-center gap-2.5 rounded-[14px] border-0 bg-accent text-sm font-bold text-white transition-colors hover:bg-opacity-90"
                [ngClass]="collapsed ? 'w-12 justify-center' : 'w-full px-3'"
                [attr.aria-label]="collapsed ? 'Ask EasyFit AI' : null">
                <app-icon name="sparkle" [size]="18"></app-icon>
                <ng-container *ngIf="!collapsed">
                    Ask EasyFit AI
                    <kbd class="ml-auto rounded-md bg-white bg-opacity-20 px-1.5 py-0.5 font-sans text-[11px] font-bold text-white">{{ shell.modifierLabel }}J</kbd>
                </ng-container>
                <span *ngIf="collapsed" class="rail-tip" aria-hidden="true">Ask EasyFit AI</span>
            </button>

            <!-- Grouped nav -->
            <nav aria-label="Main" class="flex flex-col gap-4" [class.items-center]="collapsed">
                <div *ngFor="let group of navGroups" class="flex flex-col gap-0.5" [class.items-center]="collapsed">
                    <span *ngIf="!collapsed" class="px-3 pb-1.5 text-[11px] font-bold uppercase tracking-label text-ink-4">{{ group.label }}</span>
                    <span *ngIf="collapsed" class="sr-only">{{ group.label }}</span>
                    <a
                        *ngFor="let item of group.items"
                        [routerLink]="item.path"
                        routerLinkActive
                        #rla="routerLinkActive"
                        [attr.aria-current]="rla.isActive ? 'page' : null"
                        [attr.aria-label]="collapsed ? item.label + (badgeFor(item.badge) ? ', ' + badgeFor(item.badge) : '') : null"
                        class="rail-link relative flex h-10 items-center gap-3 rounded-tile text-sm transition-colors"
                        [ngClass]="[
                            collapsed ? 'w-12 justify-center' : 'px-3',
                            rla.isActive ? 'bg-accent-soft font-bold text-accent hover:text-accent' : 'font-semibold text-ink-2 hover:bg-surface-subtle hover:text-ink'
                        ]"
                    >
                        <app-icon [name]="item.icon" [size]="19"></app-icon>
                        <ng-container *ngIf="!collapsed">
                            <span class="truncate">{{ item.label }}</span>
                            <span *ngIf="badgeFor(item.badge) as badge" class="ml-auto rounded-full px-2 py-px text-xs font-bold"
                                [ngClass]="item.badge === 'maintenance' ? 'bg-warning-bg text-warning' : 'bg-surface-muted text-neutral'">{{ badge }}</span>
                        </ng-container>
                        <span *ngIf="collapsed && item.badge === 'maintenance' && badgeFor(item.badge)" class="absolute right-2 top-1.5 h-2 w-2 rounded-full bg-warning-bar" aria-hidden="true"></span>
                        <span *ngIf="collapsed" class="rail-tip" aria-hidden="true">{{ item.label }}</span>
                    </a>
                </div>
            </nav>

            <!-- Current user -->
            <div *ngIf="currentUser" class="relative mt-auto flex items-center gap-2.5 border-t border-solid border-line-soft pt-2" [ngClass]="collapsed ? 'flex-col border-0 px-0' : 'px-1.5'">
                <button #userMenuButton type="button" (click)="toggleUserMenu()" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen" aria-controls="user-menu"
                    class="flex min-w-0 flex-grow items-center gap-2.5 rounded-tile border-0 bg-transparent p-0 text-left"
                    [attr.aria-label]="'Account menu for ' + userName">
                    <app-avatar [name]="userName" tone="dark" [size]="38" [imageUrl]="currentUser.imageURL || null"></app-avatar>
                    <span *ngIf="!collapsed" class="flex min-w-0 flex-col">
                        <span class="truncate text-sm font-bold text-ink" dir="auto">{{ userName }}</span>
                        <span class="truncate text-xs text-ink-3">{{ userRole }}</span>
                    </span>
                </button>
                <a appIconButton icon="settings" label="Profile and settings" routerLink="/profile"></a>

                <ng-container *ngIf="userMenuOpen">
                    <div class="fixed inset-0 z-10" (click)="closeUserMenu(false)" aria-hidden="true"></div>
                    <div #userMenu id="user-menu" role="menu" aria-label="Account" (keydown)="onUserMenuKeydown($event)"
                        class="absolute z-20 w-56 overflow-hidden rounded-2xl bg-surface py-1.5 shadow-overlay"
                        [ngClass]="collapsed ? 'bottom-0 left-full ml-3' : 'bottom-full left-0 mb-2'">
                        <div class="border-b border-solid border-line-soft px-4 pb-2.5 pt-1.5">
                            <p class="text-xs text-ink-3">Signed in as</p>
                            <p class="truncate text-sm font-semibold text-ink">{{ currentUser.email }}</p>
                        </div>
                        <a role="menuitem" routerLink="/profile" (click)="closeUserMenu(false)" class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-ink-2 hover:bg-surface-subtle hover:text-ink">
                            <app-icon name="user" [size]="17"></app-icon> Profile
                        </a>
                        <button role="menuitem" type="button" (click)="logout()" class="flex w-full items-center gap-3 border-0 bg-transparent px-4 py-2.5 text-left text-sm font-semibold text-danger hover:bg-surface-subtle">
                            <app-icon name="log-out" [size]="17"></app-icon> Log out
                        </button>
                    </div>
                </ng-container>
            </div>
        </aside>

        <!-- ============ Main column ============ -->
        <div class="flex min-w-0 flex-1 flex-col gap-5 px-4 pb-6 pt-4 md:px-1 md:pb-1.5 md:pt-1.5">
            <!-- Top row: ⌘K trigger + bell -->
            <div class="studio flex items-center gap-2.5">
                <button *ngIf="isPhone" appIconButton variant="outline" size="md" icon="menu" label="Open navigation" [attr.aria-expanded]="drawerOpen" (click)="openDrawer()"></button>

                <button type="button" (click)="shell.openPalette()" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K"
                    class="flex h-11 min-w-0 flex-1 items-center gap-2.5 rounded-full border border-solid border-line bg-surface pl-4 pr-2.5 text-left text-sm text-ink-3 transition-colors hover:border-line-strong md:w-[380px] md:flex-none">
                    <app-icon name="search" [size]="17"></app-icon>
                    <span class="truncate">Search or jump to…</span>
                    <kbd class="ml-auto hidden rounded-lg border border-solid border-line bg-transparent px-2 py-0.5 font-sans text-xs font-bold text-ink-3 sm:inline">{{ shell.modifierLabel }}K</kbd>
                </button>

                <span class="hidden flex-1 md:block"></span>

                <button appIconButton variant="outline" size="md" icon="bell" [label]="notificationsLabel" (click)="openNotificationsDialog()">
                    <span *ngIf="notificationNumber > 0" class="absolute right-2.5 top-[9px] h-[9px] w-[9px] rounded-full border-2 border-solid border-white bg-danger-dot" aria-hidden="true"></span>
                </button>
            </div>

            <main id="main-content" tabindex="-1" class="min-w-0 flex-1 outline-none">
                <ng-content></ng-content>
            </main>
        </div>

        <!-- ============ AI panel (third column on ≥ xl, overlay below) ============ -->
        <app-ai-panel [docked]="aiDocked" [phone]="isPhone"></app-ai-panel>
    </div>

    <app-command-palette></app-command-palette>
</div>
