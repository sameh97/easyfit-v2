# EasyFit: Postgres + Express API + Angular (served by nginx)
#
#   docker compose up -d --build     -> http://localhost (or ${WEB_PORT})
#
# Secrets and settings come from ./.env (see .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required in .env}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required in .env}
      POSTGRES_DB: ${PGSQL_DB:?PGSQL_DB is required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB is reachable by service name
      DB_HOST: db
      DB_PORT: "5432"
      APP_PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
