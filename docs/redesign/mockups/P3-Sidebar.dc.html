<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EasyFit sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside dir="{{dir}}" style="width: 256px; height: 968px; flex-shrink: 0; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); padding: 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<div dir="ltr" style="display: flex; align-items: baseline; gap: 3px; font-weight: 800; font-size: 23px; letter-spacing: -0.8px">easyfit<span style="width: 8px; height: 8px; border-radius: 4px; background: #2F4BF0"></span></div>
<button type="button" aria-label="{{collapseLabel}}" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M9 3v18"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #E7E5DF; border-radius: 16px; background: #FAF9F6">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #1B1C20; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">PH</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Power House TLV</span><span style="font-size: 12px; color: #6B6E76">{{memberCount}}</span></span>
</div>
<button type="button" style="height: 44px; border: 0; border-radius: 14px; background: #2F4BF0; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: inherit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"></path></svg>{{askAi}}<span dir="ltr" style="margin-inline-start: auto; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.2)">Ctrl J</span></button>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94">{{g.label}}</span>
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="2">
<a href="#" aria-current="{{item.current}}" style="{{item.style}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg><span>{{item.label}}</span><sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; border-top: 1px solid #EFEEE9; padding: 8px 6px 0">
<span style="width: 38px; height: 38px; border-radius: 19px; background: #1B1C20; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{userInitials}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">{{userName}}</span><span style="font-size: 12px; color: #6B6E76">{{userRole}}</span></span>
<button type="button" aria-label="{{settingsLabel}}" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6 M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","members","trainers","classes","machines","maintenance","products","catalogs"],"default":"classes"},"he":{"editor":"boolean","default":false},"$preview":{"width":256,"height":968}}'>
var ICONS = {
  dashboard: 'm3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10',
  members: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
  trainers: 'M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2 M16 11l2 2 4-4',
  classes: 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M16 2v4 M8 2v4 M3 10h18',
  machines: 'M6.5 6.5v11 M17.5 6.5v11 M3.5 9v6 M20.5 9v6 M6.5 12h11',
  maintenance: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z',
  products: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0',
  catalogs: 'm22 2-7 20-4-9-9-4Z M22 2 11 13'
};
var TEXT = {
  en: { overview: 'Overview', people: 'People', equipment: 'Equipment', shop: 'Shop', dashboard: 'Dashboard', members: 'Members', trainers: 'Trainers', classes: 'Classes', machines: 'Machines', maintenance: 'Maintenance', products: 'Products', catalogs: 'Catalogs', askAi: 'Ask EasyFit AI', memberCount: '486 members', role: 'Owner', user: 'Dana Cohen', initials: 'DC', collapse: 'Collapse sidebar', settings: 'Profile and settings' },
  he: { overview: 'סקירה', people: 'אנשים', equipment: 'ציוד', shop: 'חנות', dashboard: 'לוח בקרה', members: 'מנויים', trainers: 'מאמנים', classes: 'שיעורים', machines: 'מכשירים', maintenance: 'תחזוקה', products: 'מוצרים', catalogs: 'קטלוגים', askAi: 'שאל את EasyFit AI', memberCount: '486 מנויים', role: 'בעלים', user: 'דנה כהן', initials: 'דכ', collapse: 'כיווץ סרגל הצד', settings: 'פרופיל והגדרות' }
};
class Component extends DCLogic {
  renderVals() {
    var t = TEXT[this.props.he ? 'he' : 'en'];
    var active = this.props.active ?? 'classes';
    var item = function (key, badge, badgeTone) {
      var on = key === active;
      return {
        label: t[key], icon: ICONS[key], current: on ? 'page' : undefined, badge: badge || '',
        style: 'height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; font-size: 14px; text-decoration: none; ' + (on ? 'background: #E2E6FD; color: #2F4BF0; font-weight: 700' : 'color: #44464C; font-weight: 600'),
        badgeStyle: 'margin-inline-start: auto; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; ' + (badgeTone === 'warn' ? 'background: #FDEFD6; color: #7A4F00' : 'background: #F1F0EC; color: #55585F')
      };
    };
    return {
      dir: this.props.he ? 'rtl' : 'ltr',
      askAi: t.askAi, memberCount: t.memberCount, userName: t.user, userRole: t.role, userInitials: t.initials,
      collapseLabel: t.collapse, settingsLabel: t.settings,
      groups: [
        { label: t.overview, items: [item('dashboard')] },
        { label: t.people, items: [item('members', '486'), item('trainers'), item('classes')] },
        { label: t.equipment, items: [item('machines'), item('maintenance', '3', 'warn')] },
        { label: t.shop, items: [item('products'), item('catalogs')] }
      ]
    };
  }
}
</script>
</body>
</html>
