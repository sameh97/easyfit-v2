<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Public catalog page (Hebrew)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; overflow: hidden; background: #F5F4F0; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; display: flex; flex-direction: column; box-sizing: border-box">
<header style="padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #1B1C20; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">PH</span><span style="font-size: 15px; font-weight: 700">Power House TLV</span></div>
<span dir="ltr" style="display: flex; align-items: baseline; gap: 2px; font-weight: 800; font-size: 15px; letter-spacing: -0.5px; color: #8A8D94">easyfit<span style="width: 5px; height: 5px; border-radius: 3px; background: #2F4BF0"></span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1.15">המבצעים של השבוע</h1>
<span style="align-self: flex-start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #E3F4EA; color: #17693F">בתוקף עד יום ב׳, 5 באוק׳</span>
</div>
</header>
<ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="3">
<li style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; gap: 14px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05)">
<span style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 14px; background: {{p.tile}}; color: #8A8D94; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #F1F0EC; color: #55585F">{{p.category}}</span>
<span dir="auto" style="font-size: 16px; font-weight: 800">{{p.name}}</span>
<span dir="auto" style="font-size: 13px; color: #6B6E76; line-height: 1.35">{{p.desc}}</span>
<span style="margin-top: auto; font-size: 18px; font-weight: 800">{{p.price}}</span>
</div>
</li>
</sc-for>
</ul>
<footer style="margin-top: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 13px; color: #44464C; text-align: center">להזמנה: פנו לקבלה או התקשרו</p>
<a href="tel:035551234" style="height: 48px; border-radius: 24px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><bdi dir="ltr">03-555-1234</bdi></a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ITEMS = [
  { category: 'חלבון', name: 'Whey Protein Vanilla', desc: '2kg whey isolate, 25g protein per scoop', price: '₪249', tile: '#E8ECFE' },
  { category: 'BCAA', name: 'BCAA Watermelon', desc: '30 servings, sugar free', price: '₪119', tile: '#E4F5EC' },
  { category: 'קריאטין', name: 'Creatine Monohydrate', desc: '300g pure creatine monohydrate', price: '₪109', tile: '#FDF1D8' }
];
class Component extends DCLogic {
  renderVals() {
    return { items: ITEMS };
  }
}
</script>
</body>
</html>
