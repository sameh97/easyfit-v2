<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שיעורים בעברית</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
button,input{font-family:inherit}button{cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 1440px; height: 1000px; display: flex; gap: 16px; padding: 16px; background: #F5F4F0; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; box-sizing: border-box">
<dc-import name="P3-Sidebar" active="classes" he="{{true}}" hint-size="256px,968px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 6px 4px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="display: flex; align-items: center; gap: 10px; width: 380px; height: 44px; padding: 0 16px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #6B6E76; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg>חיפוש או מעבר אל…<span dir="ltr" style="margin-inline-start: auto; font-size: 12px; font-weight: 700; border: 1px solid #E7E5DF; border-radius: 8px; padding: 2px 8px">Ctrl K</span></button>
<span style="flex-grow: 1"></span>
<button type="button" aria-label="התראות, 3 שלא נקראו" style="position: relative; width: 44px; height: 44px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 9px; inset-inline-end: 10px; width: 9px; height: 9px; border-radius: 5px; background: #D9362B; border: 2px solid #FFFFFF"></span></button>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1">שיעורים</h1>
<p style="margin: 0; font-size: 15px; color: #6B6E76">18 שיעורים השבוע · 4 היום</p>
</div>
<button type="button" style="height: 46px; padding: 0 20px; border: 0; border-radius: 23px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>שיעור חדש</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="השבוע הקודם" style="width: 40px; height: 40px; border: 1px solid #E7E5DF; border-radius: 20px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<span style="font-size: 15px; font-weight: 700; padding: 0 6px">27 בספט׳ – 3 באוק׳ 2026</span>
<button type="button" aria-label="השבוע הבא" style="width: 40px; height: 40px; border: 1px solid #E7E5DF; border-radius: 20px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #D9D6CE; border-radius: 20px; background: #FFFFFF; color: #1B1C20; font-size: 14px; font-weight: 700">היום</button>
</div>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #44464C; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">מאמן: הכל<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 8px; width: 220px; height: 44px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E7E5DF; border-radius: 22px; color: #6B6E76; box-sizing: border-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg><input type="search" aria-label="חיפוש שיעורים" placeholder="שם השיעור" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 14px; background: transparent"></div>
</div>

<div role="tablist" aria-label="ימי השבוע" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{d.selected}}" style="{{d.style}}">
<span style="font-size: 13px; font-weight: 700; opacity: 0.75">{{d.name}}</span>
<span style="font-size: 24px; font-weight: 800; line-height: 1">{{d.date}}</span>
<span style="{{d.countStyle}}">{{d.count}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="day-title-he" style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 10px 8px">
<h2 id="day-title-he" style="margin: 0; font-size: 18px; font-weight: 800">יום רביעי, 30 בספטמבר</h2>
<span style="font-size: 13px; color: #6B6E76">4 שיעורים · אחד הסתיים</span>
</div>
<sc-for list="{{classes}}" as="c" hint-placeholder-count="4">
<button type="button" style="{{c.rowStyle}}">
<span style="width: 58px; flex-shrink: 0; display: flex; flex-direction: column; text-align: start"><span style="font-size: 16px; font-weight: 800">{{c.time}}</span><span style="font-size: 12px; color: #6B6E76">{{c.until}}</span></span>
<span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{c.dot}}"></span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; text-align: start"><span style="font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 13px; color: #6B6E76">{{c.note}}</span></span>
<span style="display: flex; align-items: center; gap: 8px; width: 190px; flex-shrink: 0"><span style="width: 30px; height: 30px; border-radius: 15px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</span><span style="font-size: 14px; font-weight: 600; color: #44464C">{{c.trainer}}</span></span>
<span style="display: flex; align-items: center; gap: 6px; width: 110px; flex-shrink: 0; font-size: 14px; color: #44464C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75"></path></svg>{{c.members}}</span>
<span style="width: 74px; flex-shrink: 0; text-align: end"><sc-if value="{{c.tag}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #2F4BF0">{{c.tag}}</span></sc-if></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</button>
</sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
var AV = [['#E8ECFE', '#2F4BF0'], ['#FDE8E4', '#B4351F'], ['#E4F5EC', '#17693F'], ['#FDF1D8', '#7A4F00'], ['#EFE7FD', '#6D3BD8'], ['#E2F3F7', '#0E6A80']];
var DAYS = [['א׳', '27', '2 שיעורים'], ['ב׳', '28', '3 שיעורים'], ['ג׳', '29', '2 שיעורים'], ['ד׳', '30', '4 שיעורים'], ['ה׳', '1', '3 שיעורים'], ['ו׳', '2', '3 שיעורים'], ['ש׳', '3', 'שיעור אחד']];
var CLASSES = [
  { time: '07:00', name: 'יוגה בוקר', note: 'רמת ביניים', trainer: 'לינה ח׳ורי', initials: 'לח', av: 0, members: '8 משתתפים', state: 'done' },
  { time: '12:00', name: 'ספינינג', note: 'להביא מים, האופניים מוכנים 10 דקות לפני', trainer: 'יוסף מנסור', initials: 'ימ', av: 5, members: '14 משתתפים', state: 'next' },
  { time: '17:30', name: 'HIIT Blast', note: 'כל הגוף, לכל הרמות', trainer: 'ח׳אלד נסאר', initials: 'חנ', av: 1, members: '9 משתתפים', state: 'later' },
  { time: '19:00', name: 'פילאטיס ליבה', note: 'להביא מגבת ומים', trainer: 'יוסף מנסור', initials: 'ימ', av: 5, members: '11 משתתפים', state: 'later' }
];
class Component extends DCLogic {
  renderVals() {
    var base = 'height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 14px; border: 0; width: 100%; font-family: inherit; color: #1B1C20; ';
    return {
      days: DAYS.map(function (d) {
        var sel = d[1] === '30';
        return {
          name: d[0], date: d[1], count: d[2], selected: sel ? 'true' : 'false',
          style: 'height: 92px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; ' +
            (sel ? 'border: 0; background: #1B1C20; color: #FFFFFF' : 'border: 1px solid #E7E5DF; background: #FFFFFF; color: #1B1C20'),
          countStyle: 'font-size: 12px; font-weight: 700; ' + (sel ? 'color: #C9CEFF' : 'color: #6B6E76')
        };
      }),
      classes: CLASSES.map(function (c) {
        return Object.assign({}, c, {
          until: c.state === 'done' ? 'הסתיים' : '',
          rowStyle: base + 'background: ' + (c.state === 'next' ? '#E2E6FD' : 'transparent') + (c.state === 'done' ? '; opacity: 0.55' : ''),
          dot: c.state === 'done' ? '#C9C6BD' : '#2F4BF0',
          avBg: AV[c.av][0], avFg: AV[c.av][1],
          tag: c.state === 'next' ? 'הבא בתור' : ''
        });
      })
    };
  }
}
</script>
</body>
</html>
