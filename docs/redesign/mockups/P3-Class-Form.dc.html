<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New class side panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
button,input,textarea{font-family:inherit}button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; display: flex; gap: 16px; padding: 16px; background: #F5F4F0; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; box-sizing: border-box">
<dc-import name="P3-Sidebar" active="classes" hint-size="256px,968px"></dc-import>
<main aria-hidden="true" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 6px 4px">
<div style="height: 44px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1">Classes</h1><p style="margin: 0; font-size: 15px; color: #6B6E76">18 classes this week · 4 today</p></div>
<div style="height: 44px"></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{strip}}" as="s" hint-placeholder-count="7"><div style="{{s}}"></div></sc-for>
</div>
<div style="flex-grow: 1; background: #FFFFFF; border-radius: 20px"></div>
</main>
<div style="position: absolute; top: 0; left: 0; width: 1440px; height: 1000px; background: rgba(27,28,32,0.38)"></div>

<div role="dialog" aria-modal="true" aria-label="New class" style="position: absolute; top: 16px; bottom: 16px; inset-inline-end: 16px; width: 480px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 20px 50px rgba(27,28,32,0.16); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px 24px; border-bottom: 1px solid #EFEEE9">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">New class</span><span style="font-size: 13px; color: #6B6E76">Fields marked <span style="color: #B4351F">*</span> are required</span></div>
<button type="button" aria-label="Close" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #F1F0EC; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94">When</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cf-date" style="font-size: 13px; font-weight: 700; color: #44464C">Date<span style="color: #B4351F"> *</span></label>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 16px; border: 1px solid #D9D6CE; border-radius: 23px; box-sizing: border-box"><input id="cf-date" type="text" value="30 Sep 2026" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; background: transparent"><button type="button" aria-label="Open calendar" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M16 2v4 M8 2v4 M3 10h18"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cf-time" style="font-size: 13px; font-weight: 700; color: #44464C">Start time<span style="color: #B4351F"> *</span></label>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border: 1px solid #2F4BF0; border-radius: 23px; box-sizing: border-box; box-shadow: 0 0 0 3px #E2E6FD"><input id="cf-time" type="text" dir="ltr" value="19:00" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; background: transparent"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6E76" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20 M12 6v6l4 2"></path></svg></div>
<span style="font-size: 12px; color: #6B6E76">24-hour, e.g. 17:30</span>
</div>
</div>

<div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; padding-top: 4px">Class</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cf-desc" style="font-size: 13px; font-weight: 700; color: #44464C">Description<span style="color: #B4351F"> *</span></label>
<textarea id="cf-desc" rows="2" style="border: 1px solid #D9D6CE; border-radius: 20px; padding: 12px 16px; font-size: 15px; font-weight: 500; resize: none; color: #1B1C20">Pilates Core: bring a towel and water</textarea>
<span style="font-size: 12px; color: #6B6E76">The part before a colon is shown as the class name.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cf-trainer" style="font-size: 13px; font-weight: 700; color: #44464C">Trainer<span style="color: #B4351F"> *</span></label>
<div style="position: relative; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 8px; border: 1px solid #D9D6CE; border-radius: 23px; box-sizing: border-box"><span style="width: 30px; height: 30px; border-radius: 15px; background: #E2F3F7; color: #0E6A80; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">YM</span><select id="cf-trainer" style="border: 0; outline: none; flex-grow: 1; font-size: 15px; font-weight: 500; background: transparent; appearance: none; font-family: inherit"><option>Yousef Mansour</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6E76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div>
</div>

<div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; padding-top: 4px">Members · 11</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="cf-members" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add members</label>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border: 1px solid #D9D6CE; border-radius: 23px; box-sizing: border-box; color: #6B6E76"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg><input id="cf-members" type="text" placeholder="Add members by name or phone" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 15px; background: transparent"></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<span style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 4px; border-radius: 17px; background: #F1F0EC; font-size: 13px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</span>{{c.name}}<button type="button" aria-label="Remove {{c.name}}" style="width: 26px; height: 26px; border: 0; border-radius: 13px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
</sc-for>
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #D9D6CE; border-radius: 17px; background: #FFFFFF; font-size: 13px; font-weight: 700; color: #1B1C20">+5 more</button>
</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #EFEEE9; background: #FAF9F6">
<button type="button" style="height: 46px; padding: 0 20px; border: 1px solid #D9D6CE; border-radius: 23px; background: #FFFFFF; color: #1B1C20; font-size: 15px; font-weight: 700">Cancel</button>
<button type="button" style="height: 46px; padding: 0 24px; border: 0; border-radius: 23px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700">Add class</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
var AV = [['#E8ECFE', '#2F4BF0'], ['#FDE8E4', '#B4351F'], ['#E4F5EC', '#17693F'], ['#FDF1D8', '#7A4F00'], ['#EFE7FD', '#6D3BD8'], ['#E2F3F7', '#0E6A80']];
var CHIPS = [['Dana Levi', 'DL', 1], ['Omar Zoabi', 'OZ', 4], ['Reem Khoury', 'RK', 0], ['Amir Mizrahi', 'AM', 2], ['Shira Katz', 'SK', 0], ['Bilal Avraham', 'BA', 3]];
class Component extends DCLogic {
  renderVals() {
    var strip = [];
    for (var i = 0; i < 7; i++) {
      strip.push('height: 92px; border-radius: 18px; ' + (i === 3 ? 'background: #1B1C20' : 'background: #FFFFFF; border: 1px solid #E7E5DF'));
    }
    return {
      strip: strip,
      chips: CHIPS.map(function (c) { return { name: c[0], initials: c[1], avBg: AV[c[2]][0], avFg: AV[c[2]][1] }; })
    };
  }
}
</script>
</body>
</html>
