<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classes: week strip and day list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
button,input{font-family:inherit}button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; display: flex; gap: 16px; padding: 16px; background: #F5F4F0; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; box-sizing: border-box">
<dc-import name="P3-Sidebar" active="classes" hint-size="256px,968px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 6px 4px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="display: flex; align-items: center; gap: 10px; width: 380px; height: 44px; padding: 0 16px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #6B6E76; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg>Search or jump to…<span dir="ltr" style="margin-inline-start: auto; font-size: 12px; font-weight: 700; border: 1px solid #E7E5DF; border-radius: 8px; padding: 2px 8px">Ctrl K</span></button>
<span style="flex-grow: 1"></span>
<button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 44px; height: 44px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 9px; inset-inline-end: 10px; width: 9px; height: 9px; border-radius: 5px; background: #D9362B; border: 2px solid #FFFFFF"></span></button>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1">Classes</h1>
<p style="margin: 0; font-size: 15px; color: #6B6E76">18 classes this week · 4 today</p>
</div>
<button type="button" style="height: 46px; padding: 0 20px; border: 0; border-radius: 23px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New class</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="Previous week" style="width: 40px; height: 40px; border: 1px solid #E7E5DF; border-radius: 20px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<span style="font-size: 15px; font-weight: 700; padding: 0 6px">27 Sep – 3 Oct 2026</span>
<button type="button" aria-label="Next week" style="width: 40px; height: 40px; border: 1px solid #E7E5DF; border-radius: 20px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #D9D6CE; border-radius: 20px; background: #FFFFFF; color: #1B1C20; font-size: 14px; font-weight: 700">Today</button>
</div>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #44464C; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">Trainer: All<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 8px; width: 220px; height: 44px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E7E5DF; border-radius: 22px; color: #6B6E76; box-sizing: border-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search classes" placeholder="Class name" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 14px; background: transparent"></div>
</div>

<div role="tablist" aria-label="Days of the week" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{d.selected}}" style="{{d.style}}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.75">{{d.name}}</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; line-height: 1">{{d.date}}</span>
<span style="{{d.countStyle}}">{{d.count}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="day-title" style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 10px 8px">
<h2 id="day-title" style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.3px">Wednesday, 30 September</h2>
<span style="font-size: 13px; color: #6B6E76">4 classes · 1 done</span>
</div>
<sc-for list="{{classes}}" as="c" hint-placeholder-count="4">
<button type="button" aria-current="{{c.current}}" style="{{c.rowStyle}}">
<span style="width: 58px; flex-shrink: 0; display: flex; flex-direction: column; text-align: start"><span style="font-size: 16px; font-weight: 800">{{c.time}}</span><span style="font-size: 12px; color: #6B6E76">{{c.until}}</span></span>
<span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{c.dot}}"></span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; text-align: start"><span style="font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 13px; color: #6B6E76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.note}}</span></span>
<span style="display: flex; align-items: center; gap: 8px; width: 190px; flex-shrink: 0"><span style="width: 30px; height: 30px; border-radius: 15px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</span><span style="font-size: 14px; font-weight: 600; color: #44464C">{{c.trainer}}</span></span>
<span style="display: flex; align-items: center; gap: 6px; width: 104px; flex-shrink: 0; font-size: 14px; color: #44464C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75"></path></svg>{{c.members}}</span>
<span style="width: 74px; flex-shrink: 0; text-align: end"><sc-if value="{{c.tag}}" hint-placeholder-val="{{false}}"><span style="{{c.tagStyle}}">{{c.tag}}</span></sc-if></span>
</button>
</sc-for>
</section>
</main>

<aside aria-label="Class details" style="width: 420px; flex-shrink: 0; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0 20px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94">Class</span>
<button type="button" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #F1F0EC; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px">Pilates Core</h2>
<span style="font-size: 15px; font-weight: 600; color: #44464C">Wed, 30 Sep · 19:00</span>
<span style="font-size: 14px; color: #6B6E76">Bring a towel and water</span>
</div>
<div style="padding: 16px 20px 0; display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 44px; border: 0; border-radius: 22px; background: #2F4BF0; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Edit class</button>
<button type="button" aria-label="More actions" style="width: 44px; height: 44px; border: 1px solid #D9D6CE; border-radius: 22px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2 M19 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2 M5 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2"></path></svg></button>
</div>
<div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94">Trainer</span>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #FAF9F6; color: #1B1C20"><span style="width: 40px; height: 40px; border-radius: 20px; background: #E2F3F7; color: #0E6A80; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">YM</span><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Yousef Mansour</span><span dir="ltr" style="font-size: 13px; color: #6B6E76; text-align: start">0557551249</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
<div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94">Participants · 11</span><a href="#" style="font-size: 13px; font-weight: 700">Show all</a></div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F3F2EE; color: #1B1C20"><span style="width: 34px; height: 34px; border-radius: 17px; background: {{p.avBg}}; color: {{p.avFg}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.initials}}</span><span style="font-size: 14px; font-weight: 600; flex-grow: 1">{{p.name}}</span><span style="{{p.pillStyle}}">{{p.pill}}</span></a>
</sc-for>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
var AV = [['#E8ECFE', '#2F4BF0'], ['#FDE8E4', '#B4351F'], ['#E4F5EC', '#17693F'], ['#FDF1D8', '#7A4F00'], ['#EFE7FD', '#6D3BD8'], ['#E2F3F7', '#0E6A80']];
var DAYS = [['Sun', '27', '2'], ['Mon', '28', '3'], ['Tue', '29', '2'], ['Wed', '30', '4'], ['Thu', '1', '3'], ['Fri', '2', '3'], ['Sat', '3', '1']];
var CLASSES = [
  { time: '07:00', name: 'Morning Yoga', note: 'Intermediate level', trainer: 'Lina Khoury', initials: 'LK', av: 0, members: '8 members', state: 'done' },
  { time: '12:00', name: 'Spinning', note: 'Bring water, bikes are set up 10 minutes before', trainer: 'Yousef Mansour', initials: 'YM', av: 5, members: '14 members', state: 'next' },
  { time: '17:30', name: 'HIIT Blast', note: 'Full body, all levels', trainer: 'Khaled Nassar', initials: 'KN', av: 1, members: '9 members', state: 'later' },
  { time: '19:00', name: 'Pilates Core', note: 'Bring a towel and water', trainer: 'Yousef Mansour', initials: 'YM', av: 5, members: '11 members', state: 'selected' }
];
var PEOPLE = [
  ['Dana Levi', 'DL', 1, 'Active'], ['Omar Zoabi', 'OZ', 4, 'Active'], ['Reem Khoury', 'RK', 0, 'Expiring'],
  ['Amir Mizrahi', 'AM', 2, 'Active'], ['Shira Katz', 'SK', 0, 'Active'], ['Bilal Avraham', 'BA', 3, 'Active']
];
class Component extends DCLogic {
  renderVals() {
    var base = 'height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 14px; border: 0; width: 100%; font-family: inherit; color: #1B1C20; ';
    return {
      days: DAYS.map(function (d) {
        var sel = d[1] === '30';
        var today = d[1] === '30';
        return {
          name: d[0], date: d[1], count: d[2] + (d[2] === '1' ? ' class' : ' classes'), selected: sel ? 'true' : 'false',
          style: 'height: 92px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; ' +
            (sel ? 'border: 0; background: #1B1C20; color: #FFFFFF' : 'border: 1px solid #E7E5DF; background: #FFFFFF; color: #1B1C20'),
          countStyle: 'font-size: 12px; font-weight: 700; ' + (sel ? 'color: #C9CEFF' : (today ? 'color: #2F4BF0' : 'color: #6B6E76'))
        };
      }),
      classes: CLASSES.map(function (c) {
        var bg = c.state === 'next' ? '#E2E6FD' : 'transparent';
        var ring = c.state === 'selected' ? 'box-shadow: inset 0 0 0 2px #2F4BF0; background: #FAF9F6' : 'background: ' + bg;
        return Object.assign({}, c, {
          until: c.state === 'done' ? 'Done' : '',
          current: c.state === 'selected' ? 'true' : undefined,
          rowStyle: base + ring + (c.state === 'done' ? '; opacity: 0.55' : ''),
          dot: c.state === 'done' ? '#C9C6BD' : '#2F4BF0',
          avBg: AV[c.av][0], avFg: AV[c.av][1],
          tag: c.state === 'next' ? 'Up next' : '',
          tagStyle: 'font-size: 12px; font-weight: 700; color: #2F4BF0'
        });
      }),
      people: PEOPLE.map(function (p) {
        var exp = p[3] === 'Expiring';
        return { name: p[0], initials: p[1], avBg: AV[p[2]][0], avFg: AV[p[2]][1], pill: p[3],
          pillStyle: 'font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; ' + (exp ? 'background: #FDEFD6; color: #7A4F00' : 'background: #E3F4EA; color: #17693F') };
      })
    };
  }
}
</script>
</body>
</html>
