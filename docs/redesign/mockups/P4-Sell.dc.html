<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell product side panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
button,input{font-family:inherit}button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; display: flex; gap: 16px; padding: 16px; background: #F5F4F0; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; box-sizing: border-box">
<dc-import name="P4-Sidebar" active="products" hint-size="256px,968px"></dc-import>
<main aria-hidden="true" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 6px 4px">
<div style="height: 44px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1">Products</h1><p style="margin: 0; font-size: 15px; color: #6B6E76">12 products · 2 low on stock</p></div>
<div style="height: 52px"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6"><div style="height: 120px; border-radius: 20px; background: #FFFFFF"></div></sc-for>
</div>
</main>
<div style="position: absolute; top: 0; left: 0; width: 1440px; height: 1000px; background: rgba(27,28,32,0.38)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="sell-title" style="position: absolute; top: 16px; bottom: 16px; inset-inline-end: 16px; width: 480px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 20px 50px rgba(27,28,32,0.16); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px 24px; border-bottom: 1px solid #EFEEE9">
<div style="display: flex; flex-direction: column; gap: 2px"><span id="sell-title" style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">Sell product</span><span style="font-size: 13px; color: #6B6E76">Fields marked <span style="color: #B4351F">*</span> are required</span></div>
<button type="button" aria-label="Close" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #F1F0EC; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #FAF9F6">
<span style="width: 48px; height: 48px; border-radius: 12px; background: #E8ECFE; color: #2F4BF0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Whey Protein Vanilla</span><span style="font-size: 13px; color: #6B6E76">₪249 each · 12 in stock</span></span>
</div>

<div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; padding-top: 4px">Quantity</div>
<div style="display: flex; align-items: center; gap: 14px">
<div role="group" aria-label="Quantity" style="display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 4px; border: 1px solid #D9D6CE; border-radius: 23px">
<button type="button" aria-label="One less" style="width: 38px; height: 38px; border: 0; border-radius: 19px; background: #F1F0EC; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<label for="s-qty" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Quantity</label>
<input id="s-qty" type="text" inputmode="numeric" dir="ltr" value="2" style="width: 48px; border: 0; outline: none; text-align: center; font-size: 17px; font-weight: 800; background: transparent">
<button type="button" aria-label="One more" style="width: 38px; height: 38px; border: 0; border-radius: 19px; background: #F1F0EC; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<span style="font-size: 13px; color: #6B6E76">Up to 12</span>
</div>

<div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; padding-top: 4px">Customer</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="s-member" style="font-size: 13px; font-weight: 700; color: #44464C">Find a member <span style="font-weight: 500; color: #6B6E76">(optional)</span></label>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 8px; border: 1px solid #D9D6CE; border-radius: 23px; box-sizing: border-box">
<span style="width: 30px; height: 30px; border-radius: 15px; background: #FDE8E4; color: #B4351F; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">SH</span>
<input id="s-member" type="text" value="Samer Hamdan · 0534343396" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; background: transparent">
<button type="button" aria-label="Clear member" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<span style="font-size: 12px; color: #6B6E76">Fills in the name and phone below.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="s-name" style="font-size: 13px; font-weight: 700; color: #44464C">Name<span style="color: #B4351F"> *</span></label><input id="s-name" type="text" value="Samer Hamdan" style="height: 46px; padding: 0 16px; border: 1px solid #D9D6CE; border-radius: 23px; font-size: 15px; font-weight: 500; box-sizing: border-box"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="s-phone" style="font-size: 13px; font-weight: 700; color: #44464C">Phone<span style="color: #B4351F"> *</span></label><input id="s-phone" type="tel" dir="ltr" value="0534343396" style="height: 46px; padding: 0 16px; border: 1px solid #D9D6CE; border-radius: 23px; font-size: 15px; font-weight: 500; box-sizing: border-box"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="s-id" style="font-size: 13px; font-weight: 700; color: #44464C">ID number<span style="color: #B4351F"> *</span></label><input id="s-id" type="text" inputmode="numeric" dir="ltr" value="03212345" style="height: 46px; padding: 0 16px; border: 1px solid #B4351F; border-radius: 23px; font-size: 15px; font-weight: 500; box-sizing: border-box; box-shadow: 0 0 0 3px rgba(180,53,31,0.12)"><span style="font-size: 12px; font-weight: 600; color: #B4351F">Enter a valid Israeli ID number (9 digits).</span></div>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #E2E6FD">
<span style="font-size: 14px; font-weight: 600; color: #2F4BF0">2 × ₪249</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #1B1C20">₪498</span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #EFEEE9; background: #FAF9F6">
<button type="button" style="height: 46px; padding: 0 20px; border: 1px solid #D9D6CE; border-radius: 23px; background: #FFFFFF; color: #1B1C20; font-size: 15px; font-weight: 700">Cancel</button>
<button type="button" style="height: 46px; padding: 0 24px; border: 0; border-radius: 23px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700">Sell · ₪498</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { cards: [1, 2, 3, 4, 5, 6] };
  }
}
</script>
</body>
</html>
