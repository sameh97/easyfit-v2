<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sales tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Rubik',sans-serif;color:#1b1c20;background:#f5f4f0}
a{color:#2F4BF0;text-decoration:none}a:hover{color:#1f36c4}
button,input{font-family:inherit}button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; display: flex; gap: 16px; padding: 16px; background: #F5F4F0; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Rubik', sans-serif; color: #1B1C20; box-sizing: border-box">
<dc-import name="P4-Sidebar" active="products" hint-size="256px,968px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 6px 4px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="display: flex; align-items: center; gap: 10px; width: 380px; height: 44px; padding: 0 16px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #6B6E76; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg>Search or jump to…<span dir="ltr" style="margin-inline-start: auto; font-size: 12px; font-weight: 700; border: 1px solid #E7E5DF; border-radius: 8px; padding: 2px 8px">Ctrl K</span></button>
<span style="flex-grow: 1"></span>
<button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border: 1px solid #E7E5DF; border-radius: 22px; background: #FFFFFF; color: #1B1C20; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1">Products</h1><p style="margin: 0; font-size: 15px; color: #6B6E76">121 sales since January</p></div>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 46px; padding: 0 20px; border: 1px solid #D9D6CE; border-radius: 23px; background: #FFFFFF; color: #1B1C20; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3"></path></svg>Export</button>
<button type="button" style="height: 46px; padding: 0 20px; border: 0; border-radius: 23px; background: #2F4BF0; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sell product</button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<div role="tablist" aria-label="Products and sales" style="display: flex; gap: 2px; padding: 4px; background: #F1F0EC; border-radius: 999px">
<button type="button" role="tab" aria-selected="false" style="border: 0; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 600; background: transparent; color: #55585F">Products</button>
<button type="button" role="tab" aria-selected="true" style="border: 0; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 700; background: #FFFFFF; color: #1B1C20; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05)">Sales</button>
</div>
<div role="group" aria-label="Date range" style="display: flex; gap: 2px; padding: 4px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 1px 2px rgba(27,28,32,0.05)">
<button type="button" aria-pressed="true" style="border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; background: #1B1C20; color: #FFFFFF">This month</button>
<button type="button" aria-pressed="false" style="border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; background: transparent; color: #55585F">Last month</button>
<button type="button" aria-pressed="false" style="border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; background: transparent; color: #55585F">This year</button>
<button type="button" aria-pressed="false" style="border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; background: transparent; color: #55585F">All</button>
</div>
<span style="flex-grow: 1"></span>
<div style="display: flex; align-items: center; gap: 8px; width: 260px; height: 44px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E7E5DF; border-radius: 22px; color: #6B6E76; box-sizing: border-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16 M21 21l-4.3-4.3"></path></svg><label for="sl-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search sales</label><input id="sl-search" type="search" placeholder="Customer, phone or product" style="border: 0; outline: none; flex-grow: 1; min-width: 0; font-size: 14px; background: transparent"></div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; color: #6B6E76">Revenue · September</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -1px">₪9,816</span></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; color: #6B6E76">Items sold</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -1px">58</span></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; color: #6B6E76">Sales</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -1px">31</span></div>
</div>

<section aria-label="Sales" style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,28,32,0.05), 0 6px 20px rgba(27,28,32,0.05); overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: start">
<th scope="col" style="text-align: start; padding: 14px 20px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; border-bottom: 1px solid #EFEEE9">Date ↓</th>
<th scope="col" style="text-align: start; padding: 14px 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; border-bottom: 1px solid #EFEEE9">Product</th>
<th scope="col" style="text-align: start; padding: 14px 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; border-bottom: 1px solid #EFEEE9">Customer</th>
<th scope="col" style="text-align: end; padding: 14px 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; border-bottom: 1px solid #EFEEE9">Qty</th>
<th scope="col" style="text-align: end; padding: 14px 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8A8D94; border-bottom: 1px solid #EFEEE9">Total</th>
<th scope="col" style="width: 56px; border-bottom: 1px solid #EFEEE9"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<tr style="height: 62px">
<td style="padding: 0 20px; border-bottom: 1px solid #F3F2EE; white-space: nowrap"><span style="display: flex; flex-direction: column"><span style="font-weight: 700">{{r.day}}</span><span style="font-size: 12px; color: #6B6E76">{{r.time}}</span></span></td>
<td style="padding: 0 12px; border-bottom: 1px solid #F3F2EE; font-weight: 600">{{r.product}}</td>
<td style="padding: 0 12px; border-bottom: 1px solid #F3F2EE"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.customer}}</span><bdi dir="ltr" style="font-size: 12px; color: #6B6E76">{{r.phone}}</bdi></span></td>
<td style="padding: 0 12px; border-bottom: 1px solid #F3F2EE; text-align: end; font-variant-numeric: tabular-nums">{{r.qty}}</td>
<td style="padding: 0 12px; border-bottom: 1px solid #F3F2EE; text-align: end; font-weight: 700; font-variant-numeric: tabular-nums">{{r.total}}</td>
<td style="padding: 0 10px; border-bottom: 1px solid #F3F2EE"><button type="button" aria-label="More actions for this sale" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #6B6E76; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2 M19 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2 M5 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2"></path></svg></button></td>
</tr>
</sc-for>
</tbody>
</table>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; font-size: 13px; color: #6B6E76; border-top: 1px solid #EFEEE9"><span>Showing 1–8 of 31</span><span style="display: flex; gap: 6px"><button type="button" aria-label="Previous page" style="width: 34px; height: 34px; border: 1px solid #E7E5DF; border-radius: 17px; background: #FFFFFF; color: #B8B6B0">‹</button><button type="button" aria-current="page" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: #1B1C20; color: #FFFFFF; font-weight: 700">1</button><button type="button" style="width: 34px; height: 34px; border: 1px solid #E7E5DF; border-radius: 17px; background: #FFFFFF; color: #1B1C20">2</button><button type="button" style="width: 34px; height: 34px; border: 1px solid #E7E5DF; border-radius: 17px; background: #FFFFFF; color: #1B1C20">3</button><button type="button" aria-label="Next page" style="width: 34px; height: 34px; border: 1px solid #E7E5DF; border-radius: 17px; background: #FFFFFF; color: #1B1C20">›</button></span></div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
var ROWS = [
  ['Tue, 22 Sep', '22:00', 'Whey Protein Vanilla', 'Samer Hamdan', '0534343396', 3, '₪747'],
  ['Mon, 21 Sep', '21:00', 'Easyfit Training Tee', 'Maya Awad', '0527427888', 1, '₪79'],
  ['Sat, 19 Sep', '14:00', 'Easyfit Training Tee', 'Ahmad Friedman', '0542020894', 3, '₪237'],
  ['Fri, 18 Sep', '19:00', 'Easyfit Hoodie', 'Salma Zoabi', '0552529082', 1, '₪179'],
  ['Fri, 18 Sep', '12:00', 'BCAA Lemon Ice', 'Ahmad Friedman', '0542020894', 3, '₪387'],
  ['Thu, 17 Sep', '09:40', 'Whey Protein Vanilla', 'Omar Zoabi', '0526612309', 2, '₪498'],
  ['Mon, 14 Sep', '19:25', 'Creatine Monohydrate', 'Reem Khoury', '0548810233', 1, '₪109'],
  ['Sat, 5 Sep', '13:00', 'Vegan Protein', 'Omar Haddad', '0531562315', 2, '₪378']
];
class Component extends DCLogic {
  renderVals() {
    return { rows: ROWS.map(function (r) { return { day: r[0], time: r[1], product: r[2], customer: r[3], phone: r[4], qty: r[5], total: r[6] }; }) };
  }
}
</script>
</body>
</html>
